<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEXO Engineering & Contracting - Profile</title>
    <style>
        :root {
            --bg-color: #1a1a1a;
            --card-bg: #262626;
            --accent-gold: #c5a059;
            --text-color: #ffffff;
            --text-muted: #a0a0a0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 40px 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        /* Header Section */
        .header-logo {
            text-align: center;
            margin-bottom: 50px;
        }

        .header-logo img {
            max-width: 380px;
            height: auto;
        }

        /* About Section */
        .about-section {
            background: var(--card-bg);
            border: 1px solid #333;
            border-radius: 12px;
            padding: 30px;
            text-align: center;
            margin-bottom: 60px;
        }

        .about-section img {
            max-width: 100%;
            height: auto;
            border-radius: 8px;
        }

        /* Section Titles */
        .section-title {
            text-align: center;
            font-size: 1.8rem;
            color: var(--accent-gold);
            margin-bottom: 30px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            position: relative;
        }

        .section-title::after {
            content: '';
            display: block;
            width: 60px;
            height: 2px;
            background: var(--accent-gold);
            margin: 10px auto 0;
        }

        /* Logo Grids */
        .logo-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 25px;
            margin-bottom: 60px;
        }

        .logo-card {
            background: var(--card-bg);
            border: 1px solid #333;
            border-radius: 8px;
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 120px;
            transition: transform 0.3s ease, border-color 0.3s ease;
        }

        .logo-card:hover {
            transform: translateY(-50px);
            border-color: var(--accent-gold);
        }

        .logo-card img {
            max-width: 80%;
            max-height: 80px;
            object-fit: contain;
        }
    </style>
</head>
<body>

    <div class="container">
        
        <!-- Main Corporate Logo -->
        <header class="header-logo">
            <img src="nexo logo.png" alt="NEXO Engineering & Contracting">
        </header>

        <!-- About & Core Values Graphic -->
        <section class="about-section">
            <img src="about.png" alt="NEXO Core Pillars">
        </section>

        <!-- Clients & Major Projects Section -->
        <h2 class="section-title">Clients & Major Projects</h2>
        <div class="logo-grid">
            <div class="logo-card">
                <img src="risox.png" alt="Rixos Baghdad">
            </div>
            <div class="logo-card">
                <img src="melinum.png" alt="Millennium Towers by Ramlah">
            </div>
            <div class="logo-card">
                <img src="ebs.png" alt="EBS Petroleum">
            </div>
            <div class="logo-card">
                <img src="Zamzam-Land-1.jpg" alt="Zamzam Land">
            </div>
        </div>

        <!-- Material Partners & Suppliers Section -->
        <h2 class="section-title">Technical Partners & Suppliers</h2>
        <div class="logo-grid">
            <div class="logo-card">
                <img src="sika.png" alt="Sika">
            </div>
            <div class="logo-card">
                <img src="fosroc.png" alt="Fosroc">
            </div>
            <div class="logo-card">
                <img src="dcp.png" alt="DCP Building Materials">
            </div>
            <div class="logo-card">
                <img src="hma.jpg" alt="HMA Construction Chemicals">
            </div>
        </div>

    </div>

</body>
</html>
